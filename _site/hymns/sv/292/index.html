<h1>1.</h1>
<p>Snart få vi bo hos Dig,
Vår Jesus, där Du är;
Du som är själv vårt hjärtas fröjd
Och all vår själs begär.</p>
<h1>2.</h1>
<p>Vårt sälla hopp nu är,
O Herre, att Dig se
Nedstiga att till mötes gå
Din brud i skyarne.</p>
<h1>3.</h1>
<p>Dock redan nu i tron
Få vi i himlen bo
Och njuta i vår Faders famn
En outsäglig ro.</p>
