<h1>1.</h1>
<p>Qu’il est bon, notre Dieu fidèle,
Notre unique et éternel ami.
Son amour est incommensurable,
Son pouvoir aussi illimité que lui.</p>
<h1>2.</h1>
<p>Notre Sauveur, Toi qui peux
Préserver les tiens de la chute,
Nous Te remercions de ce que Tu es Celui
Qui nous a sauvés et nous sauvera.</p>
