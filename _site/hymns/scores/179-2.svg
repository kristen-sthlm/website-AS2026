<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.2" width="133.00mm" height="210.00mm" viewBox="0.0000 -0.0000 89.0404 140.5901">
<style type="text/css">
<![CDATA[
tspan { white-space: pre; }
]]>
</style>
<g transform="translate(26.8792, 34.0612)">
<text font-family="Georgia Pro Cond" font-weight="bold" font-size="2.4690" text-anchor="start" fill="currentColor">
<tspan>5. </tspan>
</text>
</g>
<g transform="translate(30.4046, 34.0612)">
<text font-family="Georgia Pro Cond" font-size="2.4690" text-anchor="start" fill="currentColor">
<tspan>Det giver lugn och säkerhet,</tspan>
</text>
</g>
<g transform="translate(30.4046, 37.4286)">
<text font-family="Georgia Pro Cond" font-size="2.4690" text-anchor="start" fill="currentColor">
<tspan>Det skänker tröst och mod,</tspan>
</text>
</g>
<g transform="translate(30.4046, 40.7960)">
<text font-family="Georgia Pro Cond" font-size="2.4690" text-anchor="start" fill="currentColor">
<tspan>I ”sakta vädret” talar det</tspan>
</text>
</g>
<g transform="translate(30.4046, 44.1634)">
<text font-family="Georgia Pro Cond" font-size="2.4690" text-anchor="start" fill="currentColor">
<tspan>Om huru ”Gud är god”.</tspan>
</text>
</g>
<g transform="translate(26.8792, 52.5652)">
<text font-family="Georgia Pro Cond" font-weight="bold" font-size="2.4690" text-anchor="start" fill="currentColor">
<tspan>6. </tspan>
</text>
</g>
<g transform="translate(30.4046, 52.5652)">
<text font-family="Georgia Pro Cond" font-size="2.4690" text-anchor="start" fill="currentColor">
<tspan>Och Jesus är det dyra namn,</tspan>
</text>
</g>
<g transform="translate(30.4046, 55.9326)">
<text font-family="Georgia Pro Cond" font-size="2.4690" text-anchor="start" fill="currentColor">
<tspan>Som är oss här så kärt;</tspan>
</text>
</g>
<g transform="translate(30.4046, 59.3000)">
<text font-family="Georgia Pro Cond" font-size="2.4690" text-anchor="start" fill="currentColor">
<tspan>På jorden ingen fatta kan,</tspan>
</text>
</g>
<g transform="translate(30.4046, 62.6673)">
<text font-family="Georgia Pro Cond" font-size="2.4690" text-anchor="start" fill="currentColor">
<tspan>Vad detta namn är värt.</tspan>
</text>
</g>
<g transform="translate(26.8792, 70.5688)">
<text font-family="Georgia Pro Cond" font-weight="bold" font-size="2.4690" text-anchor="start" fill="currentColor">
<tspan>7. </tspan>
</text>
</g>
<g transform="translate(30.4046, 70.5688)">
<text font-family="Georgia Pro Cond" font-size="2.4690" text-anchor="start" fill="currentColor">
<tspan>Sin doft det namnet sprida skall</tspan>
</text>
</g>
<g transform="translate(30.4046, 73.9362)">
<text font-family="Georgia Pro Cond" font-size="2.4690" text-anchor="start" fill="currentColor">
<tspan>På vandringsstigen här;</tspan>
</text>
</g>
<g transform="translate(30.4046, 77.3035)">
<text font-family="Georgia Pro Cond" font-size="2.4690" text-anchor="start" fill="currentColor">
<tspan>Och gå vi genom dödens dal,</tspan>
</text>
</g>
<g transform="translate(30.4046, 80.6709)">
<text font-family="Georgia Pro Cond" font-size="2.4690" text-anchor="start" fill="currentColor">
<tspan>Det ljuvlig tröst beskär.</tspan>
</text>
</g>
<g transform="translate(26.8792, 89.0860)">
<text font-family="Georgia Pro Cond" font-weight="bold" font-size="2.4690" text-anchor="start" fill="currentColor">
<tspan>8. </tspan>
</text>
</g>
<g transform="translate(30.4046, 89.0860)">
<text font-family="Georgia Pro Cond" font-size="2.4690" text-anchor="start" fill="currentColor">
<tspan>När uti Fadrens hus en gång</tspan>
</text>
</g>
<g transform="translate(30.4046, 92.4534)">
<text font-family="Georgia Pro Cond" font-size="2.4690" text-anchor="start" fill="currentColor">
<tspan>I härlighet vi stå,</tspan>
</text>
</g>
<g transform="translate(30.4046, 95.8208)">
<text font-family="Georgia Pro Cond" font-size="2.4690" text-anchor="start" fill="currentColor">
<tspan>Om Jesu namn med helgon mång’</tspan>
</text>
</g>
<g transform="translate(30.4046, 99.1881)">
<text font-family="Georgia Pro Cond" font-size="2.4690" text-anchor="start" fill="currentColor">
<tspan>Vi ännu sjunga få.</tspan>
</text>
</g>
<g transform="translate(77.5287, 133.5165)">
<text font-family="Fira Sans Extra Condensed" font-weight="bold" font-size="2.7723" text-anchor="start" fill="currentColor">
<tspan>179</tspan>
</text>
</g>
</svg>
