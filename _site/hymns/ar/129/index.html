<h1>1.</h1>
<p>أنت كلمة الله الأبدية،
ابن الله في حضن الآب،
الله المُعلَن، الله المرئي المسموع،
ذبيحة الله الطاهرة.</p>
<h1>2.</h1>
<p>يا يسوع! أنت الضياء الصافي
لمجد الآب،
أنت صورة الله، بهجة السماء،
نورٌ وكمال.</p>
<h1>3.</h1>
<p>مجد كيانك وقدرته
تتجاوز تسبيحنا بكثير.
ما يعنيه اسم &quot;الابن&quot;
الآبُ وحده يفهمه كاملاً.</p>
