<h1>1.</h1>
<p>من كل ما تُعطيه بمحبتك،
يا إلهنا الصالح اللامتناهي،
لا تُرى السماء عطيَّة أعظم
من دم المسيح الثمين.</p>
<h1>2.</h1>
<p>والمحبة ذاتها تُعلِّمنا أن نؤمن
ونثق بالدم،
لأن بدونها طلب الراحة
سيكون عبثاً.</p>
<h1>3.</h1>
<p>لذلك نريد أن نُسبِّحك
على كل ما أُعطينا،
على المخلِّص الذي بذل نفسه،
ابنك الحبيب إليك.</p>
