<h1>1.</h1>
<p>يا ربُّ، وجهَك لا تُخفيه عنِّي،
وإن لم أرَك بوضوح عبر الغيوم.</p>
<h1>ل.</h1>
<p>آه أنت أمينِي وفاديَّ الثمين،
ألستَ تأتي قريباً؟
بلى، تأتي قريباً.</p>
<h1>2.</h1>
<p>بنعمتك المُخلِّصة صرتُ
سعيداً أن أكون غريباً على الأرض.</p>
<h1>3.</h1>
<p>أبقِ قلبي ثابتاً على الشيء الواحد،
راضياً بامتلاكك أنت يا ربُّ وحدك.</p>
