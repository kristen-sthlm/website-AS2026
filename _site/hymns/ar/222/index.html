<h1>1.</h1>
<p>من الألم والحزن
إلى حصني أهرب،
إلى قلب الآب الرحيم.</p>
<h1>2.</h1>
<p>في الضعف والضيق
عنده سنداً
أجده، لا يُخذلني أبداً.</p>
<h1>3.</h1>
<p>يُعطيني العزاء
على صدر أبٍ
ويُعين حين لا أحد يقدر.</p>
<h1>4.</h1>
<p>يعرف ما أنا عليه،
ومع ذلك يُحبُّني،
أبي، نفسه إلى الأبد.</p>
<h1>5.</h1>
<p>آه، مَن يشبهك،
صالحٌ وغني هكذا،
في السماء أو على الأرض!</p>
