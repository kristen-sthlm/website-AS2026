<h1>1.</h1>
<p>يا ربَّنا، نُسبِّحك الآن،
علِّمنا أن نُقدِّر أكثر
محبتَك للجماعة
التي اشتريتَها هنا بثمن غالٍ.</p>
<h1>2.</h1>
<p>حبيبتَك إلى الأبد
تحملها على قلبك
وتُنقِّيها بغسيل الكلمة
على درب القفر هنا.</p>
<h1>3.</h1>
<p>قريباً بلا غضن أو دنس
تُقدِّمها لنفسك
الجماعةَ في حُلَّة ناصعة البياض،
طاهرةً لا لوم عليها.</p>
