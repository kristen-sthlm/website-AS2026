<h1>1.</h1>
<p>عشاؤك يا ربَّنا الصالح
يتكلَّم عنك،
أعطيتَ جسدك ودمك،
وأقمتَ السلام.
كنتَ رجل الأوجاع،
حين حملتَ صليبك هنا؛
أنت الآن في المجد
إلى الأبد.</p>
<h1>2.</h1>
<p>شكراً على كلمة نعمتك،
نوراً على طريقنا!
شكراً على مائدتك الغنية
التي أعددتَها أنت!
بهذا الخمر والخبز
نحتفل بموتك الآن؛
كما أمرتَنا أنت،
نذكرك.</p>
